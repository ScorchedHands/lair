# LAIR configuration example.
# Copy to lair.yaml and adjust; `models` must list exactly one model and `path`
# must point at a GGUF file that exists on disk.

server:
  bind: 127.0.0.1
  port: 8181

engine:
  threads: 0          # 0 = pick automatically: one worker per physical core (SMT siblings excluded)
  block_size: 16      # fixed to 16
  max_batch_tokens: 512  # largest prompt chunk prefilled in one scheduler step
  # prefill_kernel: gemv   # optional; gemv | tiled | gemm — which attention/weight path the engine's prefill route selects; gemv and tiled run today, while gemm is accepted by config but refused at model open until a format-specific native kernel lands.

models:
  - name: smollm-135m-instruct-q8_0
    path: models/smollm-135m-instruct-q8_0.gguf
    type: chat
    max_context_tokens: 4096
    kv_blocks: 256
    # force_fenced_tools: false  # optional; true forces LAIR's fenced tool injection even when the model's chat template renders tools itself
    # tool_parser: auto          # optional; auto | template | fenced | none — pins which tool output parser the model resolves to at load
    # reasoning: keep            # optional; keep | strip — keep streams a recognized reasoning region through as visible content, strip withholds it
    # max_reasoning_tokens: 256  # optional; tokens a reasoning region may spend before it is closed; requires the model's tokenizer to carry <think>/</think> as whole tokens
    # max_response_tokens: 1024  # optional; tokens of visible output the model may generate
    placement:
      device: cpu
      kv_residency: dram
      prefill: cpu
      core_set: "0-15"   # optional; omit to leave the model unpinned; pinned models may not share core ids
      thread_quota: 8    # optional; caps this model's workers at 8 regardless of engine threads

  # - name: smollm-135m-instruct-q4_k_m
  #   path: models/smollm-135m-instruct-q4_k_m.gguf   # requires Q4_K_M family support — v0.3.1
  #   type: chat
  #   max_context_tokens: 4096
  #   kv_blocks: 256
  #   placement:
  #     device: cpu
  #     kv_residency: dram
  #     prefill: cpu
  #     core_set: "0-15"   # optional; omit to leave the model unpinned; pinned models may not share core ids
  #     thread_quota: 8    # optional; caps this model's workers at 8 regardless of engine threads

ui:
  recent_requests: 25 # size of the Web UI recent-request ring; hot-reloads live
